name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # 1. Reuse the build & test workflow (written once)
  build-test:
    uses: ./.github/workflows/build_and_test.yml

  # 2. Dependency vulnerability check
  dependency-check:
    needs: build-test # runs only if build-test passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets it post a summary comment on the PR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high # fail the PR on HIGH or CRITICAL
          comment-summary-in-pr: on-failure
