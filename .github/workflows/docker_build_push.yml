name: Reusable Docker Build & Push

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_image:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout the Repo
        uses: actions/checkout@v6

      # 2. Lint Dockerfile
      - name: Lint Dockerfile
        uses: jbergstroem/hadolint-gh-action@v1
        with:
          dockerfile: ./Dockerfile.multistage

      # 3. Get Short Git SHA
      - name: Get Short Git SHA
        id: sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      # 4. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 6. Build Docker Image
      - name: Build the Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.multistage
          push: false
          load: true
          tags: |
            ${{ vars.DOCKERHUB_USER }}:latest
            ${{ vars.DOCKERHUB_USER }}:sha-${{ steps.sha.outputs.short_sha }}

      # 7. Scan Docker Image for Vulnerabilities
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: "${{ vars.DOCKERHUB_USER }}:sha-${{ steps.sha.outputs.short_sha }}"
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # 8. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ vars.DOCKERHUB_USER }}:latest
          docker push ${{ vars.DOCKERHUB_USER }}:sha-${{ steps.sha.outputs.short_sha }}
